name: macOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Pi Manager
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.4+
        run: |
          set -euo pipefail
          for app in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.5_beta_2.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.4_Release_Candidate.app; do
            if [ -d "$app" ]; then
              echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
              echo "Selected $app"
              exit 0
            fi
          done
          echo "No Xcode 26.4+ install found" >&2
          ls -1 /Applications | grep '^Xcode' || true
          exit 1

      - name: Show Xcode environment
        run: |
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks

      - name: Build Debug app
        run: |
          set -o pipefail
          xcodebuild \
            -project pi-manager.xcodeproj \
            -scheme pi-manager \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
