name: agent-deck-cross-plat CI

on:
  push:
    branches: [main]
    paths:
      - "agent-deck-cross-plat/**"
      - ".github/workflows/agent-deck-cross-plat-ci.yml"
  pull_request:
    paths:
      - "agent-deck-cross-plat/**"
      - ".github/workflows/agent-deck-cross-plat-ci.yml"

defaults:
  run:
    working-directory: agent-deck-cross-plat

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: agent-deck-cross-plat/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm --filter @agent-deck/web build
      - name: Install Playwright chromium
        run: npx playwright install chromium --with-deps
        working-directory: agent-deck-cross-plat/e2e
      # Real-pi integration + e2e tests. The pinned @earendil-works/pi-coding-agent
      # workspace dependency provides the actual `pi` binary on PATH during pnpm
      # scripts, so runs are deterministic, keyless, and need no global install.
      - run: pnpm test:pi
